apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-db
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ShweKM/homelab-gitops.git
    targetRevision: main
    path: apps/forgejo-db
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated: {prune: true, selfHeal: true}